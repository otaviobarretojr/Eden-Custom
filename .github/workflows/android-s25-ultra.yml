name: Android S25 Ultra (test APK)

on:
  workflow_dispatch:
  push:
    branches:
      - android/s25-ultra-profile-v1

permissions:
  contents: read

jobs:
  build-s25-ultra:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout full Eden source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK without obsolete tools package
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install native shader build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          glslangValidator --version

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Build S25 Ultra variant
        working-directory: src/android
        run: |
          chmod +x gradlew
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew :app:assembleS25UltraRelWithDebInfo --no-daemon --stacktrace

      - name: Upload compiled test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-S25-Ultra-test-APK
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
