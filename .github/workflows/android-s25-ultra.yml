name: ASTRYX Ni no Kuni Native FPS Stability V16

on:
  workflow_dispatch:
  push:
    branches:
      - fix/astryx-translations-sources-v2
      - fix/astryx-ni-no-kuni-offline-applet-v1
      - fix/astryx-ni-no-kuni-webview-v2
      - fix/astryx-ni-no-kuni-webview-v3
      - fix/astryx-ni-no-kuni-webview-v4-diagnostics
      - fix/astryx-ni-no-kuni-webview-v5-download-logs
      - fix/astryx-ni-no-kuni-v6-eula-interaction
      - fix/astryx-ni-no-kuni-v7-ptbr-audit
      - fix/astryx-ni-no-kuni-v8-romfs-layout-audit
      - fix/astryx-ni-no-kuni-v9-vfs3-header-audit
      - fix/astryx-ni-no-kuni-v10-vfs3-index-probe
      - fix/astryx-ni-no-kuni-v11-vfs3-record-layout
      - fix/astryx-ni-no-kuni-v12-vfs3-v1-correct-layout
      - fix/astryx-ni-no-kuni-v13-vfs3-name-map
      - fix/astryx-ni-no-kuni-v14-virtual-vfs3-menu-override
      - fix/astryx-ni-no-kuni-v15-vfs3-ptbr-batch
      - perf/astryx-v16-ni-no-kuni-native-fps-profile

concurrency:
  group: astryx-ni-no-kuni-applet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-s25-ultra:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout full Eden source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK without obsolete tools package
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install native shader build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          glslangValidator --version

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6"

          # The hosted runner occasionally receives a truncated NDK ZIP.
          # Retry only this pinned package, clearing partial installs between attempts.
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if sdkmanager --install "ndk;$NDK_VERSION" &&
               test -s "$NDK_DIR/source.properties" &&
               test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
              echo "Verified pinned NDK $NDK_VERSION"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to install NDK $NDK_VERSION after three attempts"
              exit 1
            fi
            rm -rf "$NDK_DIR"
            sleep $((attempt * 10))
          done

      - name: Build pinned MIT licensed NSZ converter for Android ARM64
        run: |
          set -euo pipefail
          REV="57fed17c76c4dcb35420f7dad7c5aefc8fd49d7c"
          SRC="/tmp/andro-nsz-src"
          BUILD="/tmp/andro-nsz-build"
          mkdir -p "$SRC" src/android/app/src/s25Ultra/jniLibs/arm64-v8a src/android/app/src/s25Ultra/assets
          curl -fL --retry 3 --retry-delay 3 \
            "https://github.com/Fast-and-Pythonic/Andro-NSZ-unpacker/archive/$REV.tar.gz" \
            -o /tmp/andro-nsz.tar.gz
          tar -xzf /tmp/andro-nsz.tar.gz --strip-components=1 -C "$SRC"
          test -s "$SRC/LICENSE"
          cp "$SRC/LICENSE" src/android/app/src/s25Ultra/assets/AndroNSZ-MIT-LICENSE.txt
          cmake -S "$SRC/app/src/main/cpp" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD" --target AndroNSZ -j 4
          cp "$BUILD/libAndroNSZ.so" src/android/app/src/s25Ultra/jniLibs/arm64-v8a/libAndroNSZ.so
          file src/android/app/src/s25Ultra/jniLibs/arm64-v8a/libAndroNSZ.so
          test -s src/android/app/src/s25Ultra/jniLibs/arm64-v8a/libAndroNSZ.so
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$BUILD/libAndroNSZ.so" > /tmp/s25-nsz-symbols.txt
          grep -q Java_com_androNSZ_NszConverter_nativeConvert /tmp/s25-nsz-symbols.txt

      - name: Verify offline-only mod and translation import
        run: |
          set -euo pipefail
          UI="src/android/app/src/s25Ultra/java/org/yuzu/yuzu_emu/activities/S25UltraModBrowserActivity.kt"
          INSTALLER="src/android/app/src/s25Ultra/java/org/yuzu/yuzu_emu/activities/S25ModInstaller.kt"
          test ! -f src/android/app/src/s25Ultra/java/org/yuzu/yuzu_emu/activities/S25ModCatalog.kt
          grep -Fq 'Importar arquivo ZIP ou RAR' "$UI"
          if grep -Eq 'S25ModCatalog|S25ModOffer|Pesquisar mods|Pesquisar traduções|Baixar e instalar|https://|GameBanana|CNX histórico' "$UI"; then
            echo "Unexpected server search UI"; exit 1
          fi
          if grep -Fq 'S25ModCatalog' "$INSTALLER" || grep -Fq 'fun download(' "$INSTALLER"; then
            echo "Unexpected server download in offline installer"; exit 1
          fi

      - name: Verify install button routes mod imports to ZIP-RAR picker
        run: |
          set -euo pipefail
          DIALOG="src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/ContentTypeSelectionDialogFragment.kt"
          ADDONS="src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/AddonsFragment.kt"
          IMPORTER="src/android/app/src/s25Ultra/java/org/yuzu/yuzu_emu/activities/S25UltraModBrowserActivity.kt"
          grep -Fq 'REQUEST_INSTALL_MOD_ARCHIVE' "$DIALOG"
          grep -Fq 'REQUEST_INSTALL_MOD_ARCHIVE' "$ADDONS"
          grep -Fq 'importModArchive.launch(importer)' "$ADDONS"
          grep -Fq 'EXTRA_OPEN_PICKER' "$IMPORTER"
          grep -Fq 'chooseLocalArchive.launch(arrayOf("*/*"))' "$IMPORTER"
          grep -Fq 'setResult(Activity.RESULT_OK)' "$IMPORTER"
          grep -Fq 'installGameUpdate.launch(arrayOf("*/*"))' "$ADDONS"
          if grep -Fq 'menu.add("Importar ZIP/RAR")' "$ADDONS"; then
            echo "Redundant import menu still present"; exit 1
          fi

      - name: Verify Ni no Kuni applet bypass is title-scoped
        run: |
          set -euo pipefail
          CPP="src/core/hle/service/am/frontend/applet_web_browser.cpp"
          grep -Fq '0x0100E5600D446000ULL' "$CPP"
          grep -Fq 'shim_kind == ShimKind::Offline' "$CPP"
          grep -Fq '!AllowNiNoKuniOfflineApplet(system, web_arg_header.shim_kind)' "$CPP"
          grep -Fq 'global disable_web_applet remains unchanged' "$CPP"
          if grep -Rq 'disable_web_applet.set' src/android/app/src/s25Ultra; then
            echo "Unexpected global web applet setting mutation"; exit 1
          fi

      - name: Verify Ni no Kuni WebView bridge and local sandbox
        run: |
          set -euo pipefail
          CPP="src/common/android/applets/web_browser.cpp"
          KOTLIN="src/android/app/src/main/java/org/yuzu/yuzu_emu/applets/web/WebBrowser.kt"
          NATIVE="src/android/app/src/main/java/org/yuzu/yuzu_emu/NativeLibrary.kt"
          grep -Fq 'extract_romfs_callback();' "$CPP"
          grep -Fq '0100E5600D446000' "$CPP"
          grep -Fq 'openLocalWebPage' "$CPP"
          grep -Fq 'fun openLocal(url: String): String?' "$KOTLIN"
          grep -Fq 'blockNetworkLoads = true' "$KOTLIN"
          grep -Fq 'allowUniversalAccessFromFileURLs = false' "$KOTLIN"
          grep -Fq 'fun openLocalWebPage(url: String): String?' "$NATIVE"

      - name: Verify Ni no Kuni web applet JS completion and diagnostics
        run: |
          set -euo pipefail
          WEB="src/android/app/src/main/java/org/yuzu/yuzu_emu/applets/web/WebBrowser.kt"
          CPP="src/common/android/applets/web_browser.cpp"
          GRADLE="src/android/app/build.gradle.kts"
          grep -Fq 'window.nx = {' "$WEB"
          grep -Fq 'WebViewCompat.addDocumentStartJavaScript' "$WEB"
          grep -Fq 'window.nx.endApplet completed' "$WEB"
          grep -Fq 'HTML main page loaded' "$WEB"
          grep -Fq '$frame load failure:' "$WEB"
          grep -Fq 'HTML script state:' "$WEB"
          grep -Fq 'onConsoleMessage(message: ConsoleMessage?)' "$WEB"
          grep -Fq 'mediaPlaybackRequiresUserGesture = false' "$WEB"
          grep -Fq 'EndButtonPressed' "$CPP"
          grep -Fq 'webkit:1.12.1' "$GRADLE"

      - name: Verify offline EULA XHR compatibility and safe log downloads
        run: |
          set -euo pipefail
          WEB="src/android/app/src/main/java/org/yuzu/yuzu_emu/applets/web/WebBrowser.kt"
          SETTINGS="src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/HomeSettingsFragment.kt"
          PT="src/android/app/src/main/res/values-pt-rBR/strings.xml"
          grep -Fq 'WebViewAssetLoader.Builder()' "$WEB"
          grep -Fq 'offlineLoader.shouldInterceptRequest(target)' "$WEB"
          grep -Fq 'allowFileAccess = false' "$WEB"
          grep -Fq 'allowFileAccessFromFileURLs = false' "$WEB"
          grep -Fq 'allowUniversalAccessFromFileURLs = false' "$WEB"
          grep -Fq 'blockNetworkLoads = true' "$WEB"
          grep -Fq 'browser.loadUrl("https://$offlineHost$offlinePrefix$relativeUrl$suffix")' "$WEB"
          if grep -Fq 'browser.loadUrl(Uri.fromFile(document)' "$WEB"; then
            echo "Legacy file URL navigation remains"; exit 1
          fi
          grep -Fq 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' "$SETTINGS"
          grep -Fq 'MediaStore.MediaColumns.IS_PENDING' "$SETTINGS"
          grep -Fq 'writeLogDocument(source, fileName)' "$SETTINGS"
          grep -Fq 'R.string.log_download_success' "$SETTINGS"
          grep -Fq 'Baixar log de depuração' "$PT"
          if grep -Fq 'Intent.createChooser(intent, getText(R.string.share_log))' "$SETTINGS" ||
             grep -Fq 'Intent.createChooser(intent, getText(R.string.share_gpu_log))' "$SETTINGS"; then
            echo "Legacy Android sharesheet still used for logs"; exit 1
          fi

      - name: Verify Ni no Kuni explicit EULA input and completion
        run: |
          set -euo pipefail
          WEB="src/android/app/src/main/java/org/yuzu/yuzu_emu/applets/web/WebBrowser.kt"
          grep -Fq '.setPositiveButton("A · Selecionar", null)' "$WEB"
          grep -Fq 'window.yuzu_key_callbacks[0]' "$WEB"
          grep -Fq 'window.yuzu_footer_labels' "$WEB"
          grep -Fq 'User invoked game' "$WEB"
          grep -Fq 'KeyEvent.KEYCODE_ENTER' "$WEB"
          grep -Fq 'aButton.isEnabled = false' "$WEB"
          grep -Fq 'window.nx.endApplet completed' "$WEB"
          grep -Fq 'outcome.set("end")' "$WEB"
          if grep -Fq 'User pressed return-to-game button' "$WEB"; then
            echo "Old premature applet dismissal is still enabled"; exit 1
          fi

      - name: Verify Ni no Kuni PTBR title-scoped RomFS audit
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq '0x0100E5600D446000ULL' "$PATCH"
          grep -Fq 'data/menu/gui/titleMenu02/titleMenu02_en.mnupak' "$PATCH"
          grep -Fq 'auditTitleMenu("original RomFS", extracted)' "$PATCH"
          grep -Fq 'auditTitleMenu("merged LayeredFS", layered)' "$PATCH"
          grep -Fq 'auditTitleMenu(subdir->GetName(), romfs_dir)' "$PATCH"
          grep -Fq 'contains_pt_easy=' "$PATCH"
          grep -Fq 'type == ContentRecordType::Program' "$PATCH"
          grep -Fq 'RomFS: LayeredFS patches applied successfully' "$PATCH"

      - name: Verify Ni no Kuni original RomFS layout diagnosis
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq '[ASTRYX PTBR Layout] original directory' "$PATCH"
          grep -Fq 'original titleMenu02 file count=' "$PATCH"
          grep -Fq 'original root directory count=' "$PATCH"
          grep -Fq 'original root file count=' "$PATCH"
          grep -Fq 'std::min<std::size_t>(rootFiles.size(), 16)' "$PATCH"
          grep -Fq 'title_id == kNiNoKuniId' "$PATCH"
          grep -Fq 'auditTitleMenu("original RomFS", extracted)' "$PATCH"

      - name: Verify VFS3 bounded read-only diagnosis for Ni no Kuni
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq 'extracted->GetFile("data.vfs")' "$PATCH"
          grep -Fq 'std::array<u8, 48> header{}' "$PATCH"
          grep -Fq 'std::min<std::size_t>(header.size(), archiveSize)' "$PATCH"
          grep -Fq 'originalDataVfs->Read(header.data(), wantedBytes, 0)' "$PATCH"
          grep -Fq 'std::memcmp(header.data(), "VFS3", 4)' "$PATCH"
          grep -Fq '[ASTRYX VFS3 Audit] le32_at_04=' "$PATCH"
          grep -Fq 'title_id == kNiNoKuniId' "$PATCH"
          grep -Fq 'type == ContentRecordType::Program' "$PATCH"
          if grep -E 'originalDataVfs->(Write|Resize|Rename|Delete)' "$PATCH"; then
            echo "Unsafe archive write detected"; exit 1
          fi

      - name: Verify documented VFS3 V1 folder and file layout
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq 'constexpr u64 kFolderEntryBytes = 20;' "$PATCH"
          grep -Fq 'constexpr u64 kFileEntryBytes = 24;' "$PATCH"
          grep -Fq 'const u64 fileCountOffset =' "$PATCH"
          grep -Fq 'const u64 namesPointerPos = fileTableStart + fileTableBytes;' "$PATCH"
          grep -Fq 'archiveHas(fileTableStart, fileTableBytes)' "$PATCH"
          grep -Fq 'validNamesPointer' "$PATCH"
          grep -Fq '[ASTRYX VFS3 V1] file_names_count=' "$PATCH"
          grep -Fq 'within_payload={}' "$PATCH"
          grep -Fq 'title_id == kNiNoKuniId' "$PATCH"
          if grep -E 'originalDataVfs->(Write|Resize|Rename|Delete)' "$PATCH"; then
            echo "Unsafe VFS3 archive write detected"; exit 1
          fi

      - name: Verify VFS3 V1 targeted menu file lookup is bounded
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq 'constexpr u64 kMaxNameTableBytes = 4 * 1024 * 1024;' "$PATCH"
          grep -Fq 'nameLen > 4096' "$PATCH"
          grep -Fq 'tableFileCount == fileCount' "$PATCH"
          grep -Fq 'titleMenu02_en.mnupak' "$PATCH"
          grep -Fq '[ASTRYX VFS3 Names] parsed=' "$PATCH"
          grep -Fq '[ASTRYX VFS3 Names] menu_file_id=' "$PATCH"
          grep -Fq 'archiveHas(absoluteOffset, size)' "$PATCH"
          grep -Fq 'title_id == kNiNoKuniId' "$PATCH"
          if grep -E 'originalDataVfs->(Write|Resize|Rename|Delete)' "$PATCH"; then
            echo "Unsafe archive mutation detected"; exit 1
          fi

      - name: Verify Ni no Kuni virtual VFS3 menu override guards
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          grep -Fq 'class ASTRYXVfs3MenuOverlay final : public VfsFile' "$PATCH"
          grep -Fq 'bool IsWritable() const override { return false; }' "$PATCH"
          grep -Fq 'writeLe32(8, 0);' "$PATCH"
          grep -Fq 'writeLe32(16, static_cast<u32>(relativeNewOffset));' "$PATCH"
          grep -Fq 'writeLe32(20, static_cast<u32>(translatedSize));' "$PATCH"
          grep -Fq 'loadLe32(4) == 47314 && loadLe32(8) == 3' "$PATCH"
          grep -Fq 'folderPath ==' "$PATCH"
          grep -Fq 'title_id == kNiNoKuniId' "$PATCH"
          grep -Fq '[ASTRYX PTBR Virtual] applied=true' "$PATCH"
          grep -Fq 'rootOverride, layered' "$PATCH"
          if grep -E 'originalDataVfs->(Write|Resize|Rename|Delete)' "$PATCH"; then
            echo "Unsafe VFS3 source mutation"; exit 1
          fi
          if grep -E 'vfsOriginalForMenuPatch->(Write|Resize|Rename|Delete)' "$PATCH"; then
            echo "Unsafe VFS3 source mutation"; exit 1
          fi

      - name: Verify bounded Ni no Kuni full-pack VFS3 overlay
        run: |
          set -euo pipefail
          PATCH="src/core/file_sys/patch_manager.cpp"
          BATCH="src/core/file_sys/vfs/vfs3_ptbr_overlay.h"
          grep -Fq 'TryMakeNiNoKuniPtbrBatchView(' "$PATCH"
          grep -Fq 'if (!batchInstalled)' "$PATCH"
          grep -Fq 'const auto ptbrModLayers = auditNiNoKuni ? layers' "$PATCH"
          grep -Fq '[ASTRYX PTBR Batch] applied=true' "$PATCH"
          grep -Fq 'class Vfs3BatchTranslationView final : public VfsFile' "$BATCH"
          grep -Fq 'bool IsWritable() const override { return false; }' "$BATCH"
          grep -Fq 'constexpr std::size_t kMaxModFiles = 2000;' "$BATCH"
          grep -Fq 'constexpr std::size_t kMaxAppendBytes = 128 * 1024 * 1024;' "$BATCH"
          grep -Fq 'kExpectedFileCount = 60160' "$BATCH"
          grep -Fq 'write32(patch.bytes.data() + 8, 0)' "$BATCH"
          grep -Fq 'if (patches.size() < 2 || !matchedMenu)' "$BATCH"
          grep -Fq 'source->Read(output, originalCount, offset)' "$BATCH"
          if grep -E '(originalDataVfs|vfsOriginalForMenuPatch|source)->(Write|Resize|Rename|Delete)' "$PATCH" "$BATCH"; then
            echo "Unsafe archive modification attempt"; exit 1
          fi

      - name: Verify native FPS profile safety and telemetry
        run: |
          set -euo pipefail
          PROF="src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/NiNoKuniPerformanceProfile.kt"
          UI="src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt"
          grep -Fq 'private const val TITLE = "0100E5600D446000"' "$PROF"
          grep -Fq 'const val STABLE_1X = 1' "$PROF"
          grep -Fq 'const val PERFORMANCE_075X = 2' "$PROF"
          grep -Fq 'SettingsFile.loadCustomConfig(game)' "$PROF"
          grep -Fq 'NativeConfig.savePerGameConfig()' "$PROF"
          grep -Fq 'BooleanSetting.RENDERER_FRAME_GEN.setBoolean(false)' "$PROF"
          grep -Fq 'if (owned && NativeConfig.isPerGameConfigLoaded())' "$PROF"
          grep -Fq 'showNiNoKuniPerformanceProfiles()' "$UI"
          grep -Fq '[ASTRYX Native FPS]' "$UI"
          grep -Fq 'niNoKuniFpsWindowStart >= 10000L' "$UI"
          grep -Fq 'NiNoKuniPerformanceProfile.current(requireContext())' "$UI"
          grep -Fq 'TryMakeNiNoKuniPtbrBatchView(' src/core/file_sys/patch_manager.cpp
          if grep -E 'Write\(|Delete\(' src/core/file_sys/vfs/vfs3_ptbr_overlay.h; then
            echo "Rejecting mutation of the original VFS3 archive"
            exit 1
          fi

      - name: Build S25 Ultra variant
        working-directory: src/android
        run: |
          chmod +x gradlew
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew :app:assembleS25UltraRelWithDebInfo --no-daemon --stacktrace

      - name: Verify upgrade identity, ASTRYX brand and APK signature
        run: |
          APK="src/android/app/build/outputs/apk/s25Ultra/relWithDebInfo/app-s25Ultra-relWithDebInfo.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/s25-apk-signature.txt
          grep -qi "9d09b2001be0dde93ea0444c536b72270fab3eb1a2fccfd56e1a3c46cc0d7af1" /tmp/s25-apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5 | tee /tmp/s25-apk-identity.txt
          grep -q "name='dev.eden.eden_emulator.s25ultra.relWithDebInfo'" /tmp/s25-apk-identity.txt
          # Identity MUST stay unchanged: an app name alone must not change installed app data.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^application-label:'ASTRYX'$"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" | grep -q 'astryx_launcher_foreground' || {
            echo "ASTRYX icon resources missing"; exit 1;
          }
          # Library v2 must use ASTRYX-specific layouts and labels.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" > /tmp/astryx-library-resources.txt
          grep -q 'astryx_library_heading' /tmp/astryx-library-resources.txt
          grep -q 'astryx_library_panel' /tmp/astryx-library-resources.txt
          grep -q 'astryx_library_card_press' /tmp/astryx-library-resources.txt
          # Added settings resources are present, while app ID and signing stay untouched.
          grep -q 'astryx_settings_tab_main' /tmp/astryx-library-resources.txt
          grep -q 'astryx_setting_item_background' /tmp/astryx-library-resources.txt
          unzip -Z1 "$APK" > /tmp/s25-apk-files.txt
          grep -q 'lib/arm64-v8a/libAndroNSZ.so' /tmp/s25-apk-files.txt
          if grep -E 'libjlibtorrent|S25TorrentDownloadService' /tmp/s25-apk-files.txt; then
            echo "Legacy BitTorrent code unexpectedly present in APK"
            exit 1
          fi
          grep -q 'assets/AndroNSZ-MIT-LICENSE.txt' /tmp/s25-apk-files.txt

      - name: Upload compiled test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRYX-v16-NiNoKuni-Native-FPS-Stability-APK
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
