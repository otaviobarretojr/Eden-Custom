name: Android S25 Ultra (test APK)

on:
  workflow_dispatch:
  push:
    branches:
      - android/s25-ultra-profile-v1

permissions:
  contents: read

jobs:
  build-s25-ultra:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout full Eden source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 already includes command-line Android SDK tools.
      # Avoid setup-android v3 here: it attempts to install the removed "tools" package.
      - name: Locate pre-installed Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Build S25 Ultra variant
        working-directory: src/android
        run: |
          chmod +x gradlew
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew :app:assembleS25UltraRelWithDebInfo --no-daemon --stacktrace

      - name: Upload compiled test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-S25-Ultra-test-APK
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
