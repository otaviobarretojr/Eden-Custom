name: Windows Zen3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - performance-v0.2
      - profiles-v0.3
      - benchmark-compare-v0.4
      - benchmark-suite-v0.5
      - benchmark-report-v0.6
      - zen3-ci-v0.7
    paths:
      - "CMakeLists.txt"
      - "cpmfile.json"
      - "src/**"
      - "dist/languages/**"
      - ".github/workflows/windows-performance.yml"

permissions:
  contents: read

concurrency:
  group: windows-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout Eden Custom
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./tools/windows/install-vulkan-sdk.ps1

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: eden-cpm-windows-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/**/*.cmake') }}
          restore-keys: |
            eden-cpm-windows-

      - name: Configure MSVC Release
        shell: powershell
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DYUZU_TESTS=OFF",
            "-DDYNARMIC_TESTS=OFF",
            "-DENABLE_QT=ON",
            "-DENABLE_QT_TRANSLATION=ON",
            "-DYUZU_USE_BUNDLED_QT=ON",
            "-DCMAKE_BUILD_TYPE=Release"
          )

          $extraFlags = "/arch:AVX2"
          $cmakeArgs += "-DCMAKE_CXX_FLAGS=$extraFlags"

          $configured = $false
          $maxAttempts = 5

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "CMake configure attempt $attempt/$maxAttempts"
            $configureLog = Join-Path $env:RUNNER_TEMP "eden-cmake-configure-$attempt.log"

            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & cmake @cmakeArgs 2>&1 | Tee-Object -FilePath $configureLog
            $configureExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference

            Write-Host "CMake exit code: $configureExitCode"

            if ($configureExitCode -eq 0) {
              $configured = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "CMake configure failed. Cleaning partial build state and invalid CPM entries before retrying."

              $configureText = Get-Content -Raw -Path $configureLog
              $failedDependencies = [System.Collections.Generic.HashSet[string]]::new(
                [System.StringComparer]::OrdinalIgnoreCase
              )

              $errorContext = (
                $configureText -split "\r?\n" |
                  Where-Object { $_ -match '(?i)(error|failed|download)' }
              ) -join [Environment]::NewLine

              foreach ($match in [regex]::Matches(
                $errorContext,
                '[\\/]build[\\/]_deps[\\/]([A-Za-z0-9_.+-]+)-subbuild'
              )) {
                [void]$failedDependencies.Add($match.Groups[1].Value)
              }

              foreach ($match in [regex]::Matches(
                $configureText,
                '(?ms)Target\s+"[^"]+"\s+links to:\s+([A-Za-z0-9_.+-]+)::[A-Za-z0-9_.+-]+\s+but the target was not found'
              )) {
                [void]$failedDependencies.Add($match.Groups[1].Value)
              }

              if (Test-Path build) {
                Remove-Item -Recurse -Force build
              }

              if (Test-Path .cache/cpm) {
                foreach ($dependency in $failedDependencies) {
                  Get-ChildItem -Path .cache/cpm -Directory -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -ieq $dependency } |
                    ForEach-Object {
                      Write-Warning "Removing incomplete CPM cache entry: $($_.FullName)"
                      Remove-Item -Recurse -Force $_.FullName
                    }
                }
              }

              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          if (-not $configured) {
            throw "CMake configure failed after $maxAttempts attempts"
          }

      - name: Build Eden Custom
        shell: powershell
        run: |
          cmake --build build --config Release --target yuzu --parallel 4

      - name: Stage performance package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $eden = Get-ChildItem -Path build/bin -Recurse -Filter eden.exe -File | Select-Object -First 1
          if (-not $eden) { throw "eden.exe was not produced" }
          Copy-Item $eden.FullName package/eden.exe

          Get-ChildItem -Path $eden.Directory.FullName -Filter *.dll -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName package/ }

          $ptBr = Get-ChildItem -Path build -Recurse -Filter pt_BR.qm -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ptBr) { throw "pt_BR.qm was not produced" }
          New-Item -ItemType Directory -Force -Path package/translations | Out-Null
          Copy-Item $ptBr.FullName package/translations/pt_BR.qm

          Copy-Item LICENSE.txt package/LICENSE.txt
          Copy-Item LICENSES package/LICENSES -Recurse
          Copy-Item README.md package/README.md
          Copy-Item CUSTOM_PROJECT.md package/CUSTOM_PROJECT.md

          @(
            "Eden Custom performance build"
            "Profile: Zen3-AVX2"
            "Commit: $env:GITHUB_SHA"
            "Base: Eden v0.2.1"
            "Toolchain: MSVC / Visual Studio 2022 x64"
            "CXX flags: /arch:AVX2"
          ) | Set-Content -Encoding UTF8 package/PERFORMANCE_PROFILE.txt

      - name: Validate package
        shell: powershell
        run: |
          if (-not (Test-Path package/eden.exe)) { throw "eden.exe missing" }
          if (-not (Test-Path package/translations/pt_BR.qm)) { throw "pt_BR.qm missing" }
          Get-ChildItem -Path package -Recurse -File | Select-Object FullName, Length

      - name: Upload performance build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Custom-Zen3-AVX2-Windows-MSVC
          path: package/**
          if-no-files-found: error
          retention-days: 14
