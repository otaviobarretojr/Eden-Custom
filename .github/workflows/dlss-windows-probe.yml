name: Experimental DLSS Windows probe
on:
  push:
    branches: ['exp/dlss-*']
  workflow_dispatch:
jobs:
  windows-probe-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Windows probe build
        shell: pwsh
        run: >
          cmake -S . -B build/dlss-windows -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_NVIDIA_STREAMLINE=OFF
          -DENABLE_QT=ON
          -DYUZU_USE_BUNDLED_QT=ON
          -DYUZU_USE_BUNDLED_FFMPEG=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DYUZU_CRASH_DUMPS=OFF
      - name: Build Eden probe
        shell: pwsh
        run: cmake --build build/dlss-windows --config Release --parallel 2
      - name: Collect probe package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Get-ChildItem build/dlss-windows -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.dll' } |
            Copy-Item -Destination artifact -Force
          Set-Content artifact/DLSS-PROBE-README.txt 'Experimental semantic probe build. Streamline execution is disabled. Run a game for 5-10 minutes, move the camera, close Eden normally, then return the Eden log containing DLSS semantic probe entries.'
          if (-not (Get-ChildItem artifact -Filter *.exe)) { throw 'No Windows executable was produced.' }
      - uses: actions/upload-artifact@v4
        with:
          name: eden-dlss-semantic-probe-windows
          path: artifact/
          if-no-files-found: error
          retention-days: 14
