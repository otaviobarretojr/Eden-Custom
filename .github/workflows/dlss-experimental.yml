name: Experimental DLSS guard

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - 'exp/dlss-*'

jobs:
  dlss-source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify experimental DLSS integration invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/video_core/renderer_vulkan/present/dlss_probe.h
          test -f src/video_core/renderer_vulkan/present/dlss_probe.cpp
          grep -q 'StreamlineBootstrapState' src/video_core/renderer_vulkan/present/dlss_probe.h
          grep -q 'sl.interposer.dll' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'falling back' src/video_core/vulkan_common/vulkan_library.cpp
          ! grep -R --line-number --include='dlss_probe.*' 'slInit[[:space:]]*(' src/video_core/renderer_vulkan/present
          echo "DLSS bootstrap source guards passed"
