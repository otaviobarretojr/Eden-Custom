name: Experimental DLSS guard

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - 'exp/dlss-*'

jobs:
  dlss-source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify experimental DLSS integration invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/video_core/renderer_vulkan/present/dlss_probe.h
          test -f src/video_core/renderer_vulkan/present/dlss_probe.cpp
          grep -q 'StreamlineBootstrapState' src/video_core/renderer_vulkan/present/dlss_probe.h
          grep -q 'sl.interposer.dll' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'falling back' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'ENABLE_NVIDIA_STREAMLINE' CMakeLists.txt
          grep -q 'STREAMLINE_SDK_ROOT' CMakeLists.txt
          grep -q 'ENABLE_NVIDIA_STREAMLINE.*OFF' CMakeLists.txt
          grep -q 'verifyEmbeddedSignature' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'GetModuleFileNameW' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'HAS_NVIDIA_STREAMLINE' src/video_core/vulkan_common/vulkan_library.cpp
          grep -q 'target_link_libraries(video_core PRIVATE wintrust)' src/video_core/CMakeLists.txt
          grep -q 'StreamlineRuntime streamline_runtime' src/video_core/renderer_vulkan/renderer_vulkan.h
          grep -q 'slInit(preferences)' src/video_core/vulkan_common/streamline_runtime.cpp
          grep -q 'slShutdown()' src/video_core/vulkan_common/streamline_runtime.cpp
          grep -q 'slSetVulkanInfo(info)' src/video_core/vulkan_common/streamline_runtime.cpp
          grep -q 'BindVulkanDevice(instance, device)' src/video_core/renderer_vulkan/renderer_vulkan.cpp
          grep -q 'slIsFeatureSupported(sl::kFeatureDLSS' src/video_core/vulkan_common/streamline_runtime.cpp
          grep -q 'temporal_inputs_available' src/video_core/renderer_vulkan/present/dlss_probe.h
          test -f src/video_core/renderer_vulkan/present/dlss_inputs.h
          grep -q 'motion_vectors.IsValid()' src/video_core/renderer_vulkan/present/dlss_inputs.h
          grep -q 'GetDlssDepthCandidate' src/video_core/renderer_vulkan/vk_rasterizer.h
          grep -q 'DepthImageRange' src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q 'GetDlssColorCandidates' src/video_core/renderer_vulkan/vk_rasterizer.h
          grep -q 'ColorImageRange' src/video_core/renderer_vulkan/vk_texture_cache.h
          ! grep -q 'LoadLibraryExW' src/video_core/renderer_vulkan/present/dlss_probe.cpp
          ! grep -R --line-number --include='dlss_probe.*' 'slInit[[:space:]]*(' src/video_core/renderer_vulkan/present
          echo "DLSS bootstrap source guards passed"
