name: ASTRYX Mod Safety JVM Tests

on:
  push:
    branches:
      - feature/astryx-mod-safety-v1
  pull_request:
    branches:
      - android/s25-ultra-profile-v1

permissions:
  contents: read

jobs:
  test-mod-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install standalone Kotlin 1.9.20 compiler
        run: |
          curl --fail --location --retry 3 --output /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.20/kotlin-compiler-1.9.20.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin-compiler
          echo "/tmp/kotlin-compiler/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run JVM smoke tests
        run: bash tools/qa/run-mod-safety-smoke.sh
