name: Windows MSVC Build

on:
  workflow_dispatch:
  push:
    branches:
      - custom-v0.1
    paths:
      - "CMakeLists.txt"
      - "cpmfile.json"
      - "src/**"
      - "externals/**"
      - "tools/windows/**"
      - ".github/workflows/windows-msvc.yml"

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout Eden Custom
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./tools/windows/install-vulkan-sdk.ps1

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: eden-cpm-windows-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/**/*.cmake') }}
          restore-keys: |
            eden-cpm-windows-

      - name: Configure MSVC Release
        shell: powershell
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DYUZU_TESTS=OFF `
            -DDYNARMIC_TESTS=OFF `
            -DENABLE_QT=ON `
            -DYUZU_USE_BUNDLED_QT=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Eden Custom
        shell: powershell
        run: |
          cmake --build build --config Release --target yuzu yuzu-cmd --parallel 2

      - name: Stage portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $eden = Get-ChildItem -Path build/bin -Recurse -Filter eden.exe -File | Select-Object -First 1
          if (-not $eden) { throw "eden.exe was not produced" }
          Copy-Item $eden.FullName package/eden.exe

          $cli = Get-ChildItem -Path build/bin -Recurse -Filter eden-cli.exe -File | Select-Object -First 1
          if (-not $cli) { throw "eden-cli.exe was not produced" }
          Copy-Item $cli.FullName package/eden-cli.exe

          Get-ChildItem -Path $eden.Directory.FullName -Filter *.dll -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName package/ }

          $translations = Join-Path $eden.Directory.FullName "translations"
          if (Test-Path $translations) {
            Copy-Item $translations package/translations -Recurse
          }

          Copy-Item LICENSE.txt package/LICENSE.txt
          Copy-Item LICENSES package/LICENSES -Recurse
          Copy-Item README.md package/README.md
          Copy-Item CUSTOM_PROJECT.md package/CUSTOM_PROJECT.md

          New-Item -ItemType Directory -Force -Path package/docs/custom | Out-Null
          Copy-Item docs/custom/NSZ_CONVERTER.md package/docs/custom/NSZ_CONVERTER.md

          @(
            "Eden Custom v0.1"
            "Base: Eden v0.2.1"
            "Commit: $env:GITHUB_SHA"
            "Toolchain: MSVC / Visual Studio 2022 x64"
            "Configuration: Release"
          ) | Set-Content -Encoding UTF8 package/BUILD_INFO.txt

      - name: Validate portable package
        shell: powershell
        run: |
          Get-ChildItem -Path package -Recurse -File | Select-Object FullName, Length
          if (-not (Test-Path package/eden.exe)) { throw "eden.exe missing from package" }
          if (-not (Test-Path package/eden-cli.exe)) { throw "eden-cli.exe missing from package" }
          if (-not (Test-Path package/LICENSE.txt)) { throw "LICENSE.txt missing from package" }
          if (-not (Test-Path package/LICENSES/NSZ-MIT.txt)) { throw "NSZ MIT license missing from package" }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Custom-v0.1-Windows-MSVC
          path: package/**
          if-no-files-found: error
          retention-days: 14
